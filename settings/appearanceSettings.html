<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="/style/settings.css">
    <script defer src="/scripts/dataIntegrity.js"></script>
    <title>Appearance</title>
</head>
<body style="overflow-y: auto;">
    <div class="settingsPopup">
        <section class="titleText" style="margin-bottom: 5vw;">Appearance</section>
        <div class="text">Colors</div><br>
        <label style="font-size: 14px;" class="text">Primary Color</label><br>
        <input id="primaryClr" type="color"><br>
        <label style="font-size: 14px;" class="text">Secondary Color</label><br>
        <input id="secondaryClr" type="color"><br>
        <div style="text-align: center;"><button class="longButton" id="applyBt">Apply</button></div>
        <hr style="background-color:#303030;color:#303030;height: 1px; margin: 1vh;border: none;"><br>
        <div class="text">Background</div><br>
        <div class="bgSelect" style="text-align: center;">
            <select id="bgSelect">
                <option id="bgClr" value="colour">Color</option>
                <option id="bgImg" value="image">Image</option>
            </select>
            <div id="settings"></div>
        </div>
        
        
        <hr style="background-color:#303030;color:#303030;height: 1px; margin: 1vh;border: none;"><br>
        <label style="font-size: 16px;" class="text">Auto Hide Settings Button</label><br><input id="alwaysOnSettingsButtonCheck" type="checkbox"><br>
        <div style="text-align: center;"><button class="longButton" id="applyBtSB">Apply</button></div>
        <br><hr style="background-color:#303030;color:#303030;height: 1px; margin: 1vh;border: none;"><br>
        <div style="text-align: center;">
            <a style="border-radius: 10px; width: 50vw; user-select: none;" href="index.html"><button class="longButton">Back</button></a>
        </div>
    </div>
    <script type="module" src="/scripts/appearanceSettings.js"></script>
</body>
</html>
