<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <script defer src="scripts/dataIntegrity.js" async></script>
    <script src="scripts/time.js" type="module"></script>
    <script src="scripts/ajax.js" async></script>
    <script defer src="scripts/shortcutDrawer.js" async></script>
    <script defer src="scripts/inTabSettings.js" async></script>
    <script defer src="scripts/widgets.js" type="module" async></script>
    <script src="scripts/appearance.js" type="module"></script>
    <title>New Tab</title>
</head>
<body id="body">
    <div id="bg">
        <div style="margin: 0; padding: 0;" id="Time"></div>
        <div id="Date"></div>
        <a style="text-align: center;" id="settings"><span style="font-size: 1.5vw; text-align: center;" class="material-symbols-outlined">settings</span></a>
        <div id="weatherStats"></div>
        <div id="musicStatus"><span id="song" style="font-size: 1.3vw;"></span><br><span id="artist" style="font-size: .9vw;"></span></div>
        <div class="box" id="box"></div>
        <input id="searchBar" type="text" autocomplete="off">
        <div id="widgetsPanel">
            <div id="widgetPanelContent">
                <!-- content injected by widgets.js -->
            </div>
        </div>
    </div>
</body>
</html>
