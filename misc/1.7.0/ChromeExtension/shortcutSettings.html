<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <title>Shortcuts</title>
</head>
<body>
    <div class="settingsPopup">
        <section class="titleText" style="margin-bottom: 5vw;">Shortcuts</section>
        <form class="settingsIn"><input id="shortcutAddr" type="url" autocomplete="off" placeholder="Enter the URL"></input><button id="addShortcut">Add</button></form><br>
        <div id="shortcuts"></div>
        <button class="longButton" id="applyBtS">Apply</button>
        <a style="border-radius: 10px; width: 300px; user-select: none;" href="settings.html"><button class="longButton" id="backBtS">Back</button></a>
    </div>
    <script type="module" src="scripts/shortcutSettings.js"></script>
</body>
</html>
